<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cida e Ricardo</title>

    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="presentes.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header class="nomes relevo-texto">
        <h1>Cida e Ricardo</h1>
    </header>
    
    <section class="qrcode">
        <img id="copiar-qrcode" src="qrcode.png" alt="QR Code"  data-code="00020126580014BR.GOV.BCB.PIX01361dbe74fb-1dc8-4161-83b5-ab52dac63c965204000053039865802BR5920Ricardo Pereira Dias6009SAO PAULO62140510J84fWI7iwO6304C53A">
    </section>

    <section class="mensagem">
        <h3>Pix copia e cola</h3>
        <p>
            Se o coração mandar, toque no QR Code para copiar
            nosso pix e nos ajudar nessa nova etapa.
        </p>
    </section>

    <nav class="menu relevo-link">
        <ul>
            <li>
                <a href="index.html">
                    <i class="fa-solid fa-home"></i>
                </a>

                <p>Início</p>
            </li>

            <li>
                <a href="cerimonia.html">
                    <i class="fa-solid fa-location-dot"></i>
                </a>

                <p>Cerimônia</p>
            </li>

            <li>
                <a href="presentes.html" class="ativo">
                    <i class="fa-solid fa-gift"></i>
                </a>

                <p>Presentes</p>
            </li>

            <li>
                <a href="confirmar.html">
                    <i class="fa-solid fa-user-plus"></i>
                </a>

                <p>Confirmar</p>
            </li>
        </ul>
    </nav>

    <script>
        window.addEventListener("load", function() {
            const qrcodeImage = document.getElementById("copiar-qrcode");

            if (qrcodeImage !== null) {
                qrcodeImage.addEventListener("click", () => {
                    copiar(qrcodeImage.dataset.code);
                });
            }
        });

        function copiar(codigo)
        {
            navigator.clipboard.write([
                new ClipboardItem({
                "text/plain": new Blob([codigo], { type: "text/plain" })
                })
            ]).then(() => alert("QR Code copiado!"));
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/js/all.min.js" integrity="sha512-2+f4MxT8KwN4tUzw6/hv9kxKiix603S9kmBcix+0y0dBhd6zdaPOV1Thf1DM886pFZG+cAtmshBi8UBpo6m3JA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
